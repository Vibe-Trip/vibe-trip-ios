name: Bug
description: 버그 발생
title: "[Bug] "
labels: ["bug"]

body:
  - type: textarea
    attributes:
      label: 📄 설명
      description: 발생한 버그에 대해 작성해주세요.
      placeholder: 자세히 적을수록 좋습니다.
    validations:
      required: true

  - type: textarea
    attributes:
      label: 🔁 재현 방법
      description: 버그를 재현하는 단계를 작성해주세요.
      value: |
        1. 
        2. 
        3. 
    validations:
      required: false

  - type: textarea
    attributes:
      label: ✅ to-do-list
      description: 작업할 내용들에 대해 작성해주세요
        - type: textarea
    attributes:
      label: ✅ to-do-list
      description: 작업할 내용들에 대해 작성해주세요.
      value: |
        - [ ] TODO
    validations:
      required: false
      
  - type: textarea
    attributes:
      label: 🖼️ 첨부 자료
      description: 문제를 보여주는 사진이나 로그 정보 등이 있다면 작성해주세요.
      placeholder: ex) 코드, 로그, 모니터링 결과 등
