name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-template: '$MAJOR.$MINOR.$PATCH'

categories:
  - title: 'Added'
    labels: ['feature']
  - title: 'Fixed'
    labels: ['bug', 'fix']
  - title: 'Changed'
    labels: ['refactor']
  - title: 'Build & Infra'
    labels: ['chore']

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

replacers:
  - search: '/(feat|fix|chore|refactor|docs|test)(\(#\d+\))?:\s*/g'
    replace: ''

template: |
  ## Highlights
  <!-- 배포 전 직접 작성 -->

  $CHANGES
